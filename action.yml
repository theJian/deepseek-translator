name: DeepSeek Translator
description: GitHub Action to translate i18next JSON using DeepSeek or Xiaomi MiMo.
author: theJian

inputs:
  model:
    description: DeepSeek or MiMo model ID (default deepseek-flash); determines the API provider
  deepseek-api-key:
    description: API key for DeepSeek
    required: false
  mimo-api-key:
    description: API key for Xiaomi MiMo
    required: false

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Run DeepSeek Translator
      shell: bash
      env:
        DEEPSEEK_API_KEY: ${{ inputs.deepseek-api-key }}
        MIMO_API_KEY: ${{ inputs.mimo-api-key }}
        TRANSLATOR_MODEL: ${{ inputs.model }}
      run: |
        uv run --project "$GITHUB_ACTION_PATH" deepseek-translator
